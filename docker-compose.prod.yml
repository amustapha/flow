services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: flow-backend-prod
    ports:
      - "4322:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/flow.db
      - PYTHONUNBUFFERED=1
      - ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # CORS Configuration - comma-separated origins (e.g., https://reminder.amustapha.com)
      - CORS_ORIGINS_STR=${CORS_ORIGINS_STR:-http://localhost:3000}
      # VAPI Configuration - set in Dokploy UI
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - VAPI_MODEL_PROVIDER=${VAPI_MODEL_PROVIDER:-openai}
      - VAPI_MODEL_NAME=${VAPI_MODEL_NAME:-gpt-4}
      - VAPI_MODEL_TEMPERATURE=${VAPI_MODEL_TEMPERATURE:-0.7}
      - VAPI_VOICE_PROVIDER=${VAPI_VOICE_PROVIDER:-11labs}
      - VAPI_VOICE_ID=${VAPI_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: flow-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: flow-celery-worker-prod
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/flow.db
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # VAPI Configuration - set in Dokploy UI
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - VAPI_MODEL_PROVIDER=${VAPI_MODEL_PROVIDER:-openai}
      - VAPI_MODEL_NAME=${VAPI_MODEL_NAME:-gpt-4}
      - VAPI_MODEL_TEMPERATURE=${VAPI_MODEL_TEMPERATURE:-0.7}
      - VAPI_VOICE_PROVIDER=${VAPI_VOICE_PROVIDER:-11labs}
      - VAPI_VOICE_ID=${VAPI_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: flow-celery-beat-prod
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/flow.db
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # VAPI Configuration - set in Dokploy UI
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - VAPI_MODEL_PROVIDER=${VAPI_MODEL_PROVIDER:-openai}
      - VAPI_MODEL_NAME=${VAPI_MODEL_NAME:-gpt-4}
      - VAPI_MODEL_TEMPERATURE=${VAPI_MODEL_TEMPERATURE:-0.7}
      - VAPI_VOICE_PROVIDER=${VAPI_VOICE_PROVIDER:-11labs}
      - VAPI_VOICE_ID=${VAPI_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # Set in Dokploy UI - required at build time for Next.js
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: flow-frontend-prod
    ports:
      - "4321:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
  redis_data:
